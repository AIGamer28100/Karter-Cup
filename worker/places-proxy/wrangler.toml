name = "karter-places-proxy"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
FIREBASE_PROJECT_ID = "karter-cup"
# Comma-separated list of exact origins allowed to call the proxy from a browser.
ALLOWED_ORIGINS = "https://karter-cup.web.app,https://karter-cup.firebaseapp.com"

# Secret (never committed):  npx wrangler secret put GOOGLE_PLACES_API_KEY

# Local development only: `npx wrangler dev --env dev` also allows the Vite dev server.
[env.dev.vars]
FIREBASE_PROJECT_ID = "karter-cup"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173"
